# Band definitions for banded (dropdown) columns in the client workbook.
# For each header: the ordered labels (rank 0 = lowest) and the [low, high] range of each band.
# Ranges are in the column's `unit`; `est` = midpoint, or the lower bound for open-ended bands.
# "0" means "product not held" (estimate 0). Estimates are for aggregate analytics only;
# answers must say they are band-based estimates.

Client Creation Date:
  column: tenure_band
  unit: years
  description: How long the person has been a client (relationship tenure)
  bands:
    - [Upto 1 year, 0, 1]
    - [1 to 3 years, 1, 3]
    - [3 to 8 years, 3, 8]
    - [8 to 12 years, 8, 12]
    - [12 years +, 12, null]

Age Group:
  column: age_group
  unit: years
  description: Client age band
  bands:
    - [18-24, 18, 24]
    - [25-35, 25, 35]
    - [36-45, 36, 45]
    - [46-55, 46, 55]
    - [56+, 56, null]

Income Group:
  column: income_group
  unit: inr_per_year
  scale: 100000          # labels are in lakhs per annum
  description: Annual income band (lakhs per annum)
  bands:
    - ["0", 0, 0]
    - [1- 2.5, 1, 2.5]
    - [2.6-8, 2.6, 8]
    - [8.1-12, 8.1, 12]
    - [12.1-24, 12.1, 24]
    - [24.1-48, 24.1, 48]
    - [48.1+, 48.1, null]

Client Type:
  column: risk_profile
  unit: rank
  description: Risk profile of the client (investment risk appetite)
  bands:
    - [Conservative, 1, 1]
    - [Moderately Conservative, 2, 2]
    - [Moderate, 3, 3]
    - [Moderately Aggressive, 4, 4]
    - [Aggressive, 5, 5]

AUM of Client:
  column: aum_band
  unit: inr
  description: Assets under management for the client
  bands:
    - [Less than 10 lakhs, 0, 1000000]
    - [10 lakhs - 25 lakhs, 1000000, 2500000]
    - [25 lakhs - 50 lakhs, 2500000, 5000000]
    - [50 lakhs - 1 cr, 5000000, 10000000]
    - [1 cr - 5 cr, 10000000, 50000000]
    - [5 cr and above, 50000000, null]

Term:
  column: term_cover_band
  product: true          # creates has_<product> flag
  unit: inr
  description: Term life insurance sum assured
  bands:
    - ["0", 0, 0]
    - [Upto 50 lac, 0, 5000000]
    - [50 lac to 1cr, 5000000, 10000000]
    - [1cr to 5cr, 10000000, 50000000]
    - [5cr to 10cr, 50000000, 100000000]
    - [10cr +, 100000000, null]

Health:
  column: health_cover_band
  product: true          # creates has_<product> flag
  unit: inr
  description: Health insurance sum insured
  bands:
    - ["0", 0, 0]
    - [Upto 5 lac, 0, 500000]
    - [5 lac to 8 lac, 500000, 800000]
    - [8 lac to 15 lac, 800000, 1500000]
    - [15 lac to 25 lac, 1500000, 2500000]
    - [25 lac+, 2500000, null]

SIP:
  column: sip_band
  product: true          # creates has_<product> flag
  unit: inr_per_month
  description: Monthly SIP (systematic investment plan) amount
  bands:
    - ["0", 0, 0]
    - [Upto 5k, 0, 5000]
    - [5.1 k to 10 k, 5100, 10000]
    - [10.1 k to 25k, 10100, 25000]
    - [25.1 k to 50k, 25100, 50000]
    - [50.1k to 1 lac, 50100, 100000]
    - [1lac and above, 100000, null]

SWP:
  column: swp_band
  product: true          # creates has_<product> flag
  unit: inr
  description: Corpus under SWP (systematic withdrawal plan)
  bands:
    - ["0", 0, 0]
    - [Upto 25 Lacs, 0, 2500000]
    - [26L to 50L, 2600000, 5000000]
    - [51L to 75L, 5100000, 7500000]
    - [76L to 1Cr, 7600000, 10000000]
    - [1Cr+, 10000000, null]

PMS:
  column: pms_band
  product: true          # creates has_<product> flag
  unit: inr
  description: Amount in PMS (portfolio management services)
  bands:
    - ["0", 0, 0]
    - [Upto 25 lac, 0, 2500000]
    - [25 to 50, 2500000, 5000000]
    - [50 to 75, 5000000, 7500000]
    - [75 to 1Cr, 7500000, 10000000]
    - [1Cr +, 10000000, null]

LAS:
  column: las_band
  product: true          # creates has_<product> flag
  unit: inr
  description: Loan against securities amount
  bands:
    - ["0", 0, 0]
    - [Upto 5 lac, 0, 500000]
    - [5 to 10 lac, 500000, 1000000]
    - [More than 10 lac, 1000000, null]

LI Premium (Savings Plan):
  column: li_premium_band
  product: true          # creates has_<product> flag
  unit: inr_per_year
  description: Annual life-insurance savings-plan premium
  bands: &premium
    - ["0", 0, 0]
    - [Less than 24k, 0, 24000]
    - [24.1k to 50k, 24100, 50000]
    - [50.1k to 1lac, 50100, 100000]
    - [1lac to 4lac, 100000, 400000]
    - [4lac and above, 400000, null]

ULIPs:
  column: ulip_band
  product: true          # creates has_<product> flag
  unit: inr_per_year
  description: Annual ULIP premium
  bands: *premium
